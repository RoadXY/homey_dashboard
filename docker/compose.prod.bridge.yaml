services:
  dashboard:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5173
      MDNS_ENABLED: ${MDNS_ENABLED:-false}
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"
    networks:
      - dashboard_network
    volumes:
      - dashboard_data:/app/data
    restart: unless-stopped

volumes:
  dashboard_data:

networks:
  dashboard_network:
    driver: bridge

  <path d="M291 370 L360 362" stroke="#8994a2" stroke-width="5" stroke-linecap="round"/>

  <!-- Control tile symbols -->
  <path d="M499 275 L499 319 L514 306 L530 319 L530 268 Z" fill="#d5dbe4"/>
  <path d="M585 268 L585 309 M576 277 L594 277 M576 289 L594 289" stroke="#d5dbe4" stroke-width="8" stroke-linecap="round"/>
  <path d="M666 260 L666 309 M654 274 L678 274 M654 290 L678 290" stroke="#d5dbe4" stroke-width="7" stroke-linecap="round"/>

  <!-- Weather panel -->
  <path d="M282 418 L450 398 L467 527 L299 548 Z" fill="#202731"/>
  <path d="M310 453 L365 446" stroke="#f4f5f7" stroke-width="21" stroke-linecap="round"/>
  <circle cx="414" cy="448" r="15" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <path d="M400 478 Q413 456 434 471 Q450 475 449 493 L405 499 Q390 493 400 478Z" fill="none" stroke="#b8c3d0" stroke-width="7" stroke-linejoin="round"/>
  <path d="M312 515 L350 510 M365 508 L397 504" stroke="#aab4c1" stroke-width="6" stroke-linecap="round"/>

  <!-- Notification panel -->
  <path d="M480 386 L709 358 L739 576 L510 606 Z" fill="#171d25"/>

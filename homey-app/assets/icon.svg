  <path d="M246 253 L672 203 L741 648 L303 716 Z" fill="url(#screen)"/>

  <!-- Screen layout -->
  <path d="M265 273 L431 253 L449 376 L281 396 Z" fill="#1d232c" rx="12"/>
  <path d="M460 250 L535 241 L552 358 L477 368 Z" fill="#242b35"/>
  <path d="M548 240 L623 231 L640 348 L565 357 Z" fill="#242b35"/>
  <path d="M636 230 L690 224 L707 340 L653 347 Z" fill="#242b35"/>

  <!-- Clock -->

  <path d="M501 445 L696 421 L704 489 L510 513 Z" fill="#443923" stroke="#80632f" stroke-width="3"/>
  <path d="M520 466 L660 449 M522 486 L634 472" stroke="#f1d18b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="704" cy="395" r="12" fill="none" stroke="url(#gold)" stroke-width="6"/>

  <!-- Measurement tiles -->
  <path d="M309 565 L394 554 L407 654 L322 667 Z" fill="#242b35"/>
  <path d="M416 552 L499 542 L512 637 L429 649 Z" fill="#242b35"/>
  <path d="M330 593 L381 587 M438 581 L487 575" stroke="#dce2ea" stroke-width="8" stroke-linecap="round"/>
  <path d="M330 626 L375 620 M438 613 L480 608" stroke="#aab4c1" stroke-width="6" stroke-linecap="round"/>

  <!-- Camera / status detail -->
  <circle cx="220" cy="470" r="7" fill="#87919d"/>
  <path d="M278 754 L755 679" stroke="#8b949f" stroke-width="3" opacity=".55"/>
</svg>
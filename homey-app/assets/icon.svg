<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#343a43"/>
      <stop offset="0.48" stop-color="#11151b"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#68717c"/>
      <stop offset="0.5" stop-color="#252b34"/>
      <stop offset="1" stop-color="#080a0d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252b34"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4cb70"/>
      <stop offset="1" stop-color="#bd8734"/>
    </linearGradient>
  </defs>

  <!-- Compact tablet body, shown from a subtle right-side angle -->
  <path d="M205 238 Q205 202 244 190 L694 137 Q731 133 744 169 L811 680 Q817 718 779 729 L314 802 Q278 808 270 771 Z"
        fill="#05070a" opacity=".18" transform="translate(0 16)"/>
  <path d="M190 222 Q190 187 228 178 L676 126 Q716 121 729 158 L798 667 Q804 705 766 716 L302 788 Q264 794 256 756 Z"
        fill="url(#edge)" stroke="#77818d" stroke-width="8" stroke-linejoin="round"/>
  <path d="M202 226 Q202 198 232 191 L672 140 Q704 136 714 166 L780 663 Q785 691 757 699 L307 769 Q278 773 272 746 Z"
        fill="url(#frame)" stroke="#090c10" stroke-width="7" stroke-linejoin="round"/>

  <!-- Bezel and display -->
  <path d="M232 239 L681 186 Q694 184 697 199 L758 650 Q761 666 746 669 L299 739 Q285 741 283 726 L222 255 Q220 242 232 239 Z"

services:
  dashboard:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "5173:3000"
    volumes:
      - dashboard_data:/app/data
    restart: unless-stopped

volumes:
  dashboard_data:

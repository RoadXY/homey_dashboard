services:
  dashboard:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${DASHBOARD_PORT:-5173}
    network_mode: host
    volumes:
      - dashboard_data:/app/data
    restart: unless-stopped

volumes:
  dashboard_data:

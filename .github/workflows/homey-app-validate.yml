name: Validate Homey app

on:
  push:
    branches: [phase_1_foundation]
    paths:
      - "homey-app/**"
      - ".github/workflows/homey-app-*.yml"
  pull_request:
    branches: [phase_1_foundation]
    paths:
      - "homey-app/**"
      - ".github/workflows/homey-app-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homey-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: homey-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Validate app against Homey verified level
        run: npx --yes homey app validate --level verified

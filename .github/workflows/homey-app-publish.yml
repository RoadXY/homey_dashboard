name: Publish Homey app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Homey app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homey-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: homey-app/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Publish to Homey App Store
        env:
          HOMEY_HEADLESS: "1"
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        run: npx --yes homey app publish
      - name: Summary
        run: |
          APP_ID=$(node -p "require('./app.json').id")
          echo "Manage your app at https://tools.developer.homey.app/apps/app/${APP_ID}." >> "$GITHUB_STEP_SUMMARY"

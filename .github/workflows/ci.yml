name: Validate dashboard build

on:
  push:
    branches: [phase_1_foundation, feature/weather-settings, feature/settings-design-system-v2]
    paths-ignore:
      - "homey-app/**"
  pull_request:
    branches: [phase_1_foundation]
    paths-ignore:
      - "homey-app/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Run automated tests
        run: npm test
      - name: Validate OpenAPI specification
        working-directory: .
        run: npx --yes @redocly/cli lint docs/api/openapi.yaml
      - name: Build frontend and backend
        run: npm run build
      - name: Build production Docker image
        working-directory: .
        run: docker build --file docker/Dockerfile --target runtime -t homey-dashboard:ci docker
